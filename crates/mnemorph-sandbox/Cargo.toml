[package]
name = "mnemorph-sandbox"
description = "The sandbox: landlock and seccomp on Linux, Seatbelt on macOS, the network policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]

# The sandbox calls into the kernel: unsafe is denied, and allowed only at reviewed sites.
# Cargo cannot override one workspace lint, so this mirrors the workspace table with that one
# change; tools/check-layers.mjs fails if the two drift.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
