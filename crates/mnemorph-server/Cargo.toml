[package]
name = "mnemorph-server"
description = "The server: JSON-RPC over stdio and WebSocket, events, the board assets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
mnemorph-loop = { path = "../mnemorph-loop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
