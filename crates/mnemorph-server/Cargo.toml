[package]
name = "mnemorph-server"
description = "The server: JSON-RPC over stdio and WebSocket, events, the board assets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
mnemorph-loop = { path = "../mnemorph-loop" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "signal"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[dev-dependencies]
serde_json = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
