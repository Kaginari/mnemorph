[package]
name = "mnemorph-config"
description = "Configuration: TOML layers with origins, the gate's loosening rules, models, budgets, providers, Oni envelopes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
mnemorph-ledger = { path = "../mnemorph-ledger" }
mnemorph-races = { path = "../mnemorph-races" }
mnemorph-tools = { path = "../mnemorph-tools" }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
toml_edit = "0.25"

[dev-dependencies]
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3"

[lints]
workspace = true
