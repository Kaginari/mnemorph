description = "The Dark Elf's proving: the finding record, its validator, and the reading of a Dark Elf's report against the landing's tree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
mnemorph-races = { path = "../mnemorph-races" }
mnemorph-wire = { path = "../mnemorph-wire" }
serde = { version = "1", features = ["derive"] }
