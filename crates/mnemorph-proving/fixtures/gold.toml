# The reviewers' gold set: labelled cases a reviewer judges, to measure how often it passes a real
# bug and how often it flags a sound one.
#
# The set is three sources. The seeded fixture's 18 plants (bugs) and 7 negative controls (not
# bugs) are read from `seeded.toml` and `seeded/`, never copied here. This file adds the rest:
#
# - `session`: the real findings the playbooks' Regression lines name, each a bug a review found in
#   Mnemorph and a merged change fixed (`fixed_in`). `code` is the flawed shape, cut to the lines
#   that show it; `regression` is the words of its class's Regression line that name it.
# - `false-positive`: claims a reviewer could plausibly raise that are not findings by their
#   class's "Not a finding" line; `reason` is the fact that rules each one out.
#
# A case: its id and source; `label` (`bug` or `not-bug`); the speciality and class that own it;
# for a bug, the severity its witness shows; the file and symbol it names; the candidate claim a
# reviewer is asked to judge; and the code it judges. Tokens are labelled fakes, hosts `.invalid`.
# The set grows: a finding confirmed, or a claim dismissed on review, is added here as a case.

# --- session: real findings --------------------------------------------------------------------

[[case]]
