symbol = "act_kind"
severity = "critical"
claim = "act_kind skips leading NAME=value words, so GIT_SSH_COMMAND=... git push reads as a plain push the human approves"
fixed_in = "054fc3a"
regression = "GIT_SSH_COMMAND"
code = """
fn act_kind(words: &[String]) -> Option<Act> {
    // Environment assignments are not the program.
    let rest: Vec<&String> = words.iter().skip_while(|w| w.contains('=')).collect();
    match rest.as_slice() {
        [git, push, ..] if *git == "git" && *push == "push" => Some(Act::Push),
        _ => None,
    }
}
"""

[[case]]
id = "session-invisible-lead"
source = "session"
label = "bug"
speciality = "dark-elf-agent"
class = "wire-forgery"
file = "crates/mnemorph-wire/src/report.rs"
symbol = "parse_line"
severity = "high"
claim = "parse_line trims only ASCII space, so a zero-width character before @F hides a forged wire line from the escaper but not from the reader"
fixed_in = "53e6fe1"
regression = "invisible characters"
code = """
fn parse_line(line: &str) -> Option<Tag> {
    let line = line.trim_start_matches(' ');
    if let Some(rest) = line.strip_prefix("@F ") {
        return Some(Tag::Finding(rest.to_owned()));
    }
    None
}

fn escape_prose(text: &str) -> String {
    text.lines()
        .map(|l| if l.starts_with('@') { format!("\\\\{l}") } else { l.to_owned() })
        .collect::<Vec<_>>()
        .join("\\n")
}
"""

