[[case]]
id = "fp-idempotent-label"
source = "false-positive"
label = "not-bug"
speciality = "dark-elf-law"
class = "phantom-effect"
file = "crates/mnemorph-config/src/receipt.rs"
symbol = "observe_label"
claim = "observe_label reports a label already on the issue, so it reads pre-existing state as this act's effect"
reason = "the label was on the issue before the act, and the receipt says Already, never Observed: an idempotent act reporting the state as already present"
code = """
fn observe_label(before: &Issue, after: &Issue, label: &str) -> Receipt {
    match (has(before, label), has(after, label)) {
        (true, true) => Receipt::Already,
        (false, true) => Receipt::Observed,
        _ => Receipt::Missing,
    }
}
"""

[[case]]
id = "fp-deep-chain"
source = "false-positive"
label = "not-bug"
speciality = "dark-elf-law"
class = "unbounded-delegation"
file = "crates/mnemorph-loop/src/commission.rs"
symbol = "may_dispatch"
claim = "may_dispatch lets an Elf commission an Orc that commissions a Slime, a chain three deep with no end"
reason = "the depth is bounded by the ranks and the budget is debited before each body opens: a deep chain within its caps"
code = """
fn may_dispatch(roster: &Roster, from: &str, to: &str, left_wt: u64, slice_wt: u64) -> Result<(), Refusal> {
    if roster.rank(to) >= roster.rank(from) { return Err(Refusal::Rank); }
    if slice_wt > left_wt { return Err(Refusal::Budget); }
    if roster.chain(to).first().map(String::as_str) != Some(from) { return Err(Refusal::NotYours); }
    Ok(())
}
"""

