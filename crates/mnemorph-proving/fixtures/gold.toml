/// The receipt of `gh issue edit --add-label`: the label is on the issue now.
fn observe_label(issue: &Issue, label: &str) -> Receipt {
    if issue.labels.iter().any(|l| l == label) {
        Receipt::Observed
    } else {
        Receipt::Missing
    }
}
"""

