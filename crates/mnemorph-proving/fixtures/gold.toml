claim = "toolchain_grants opens all of ~/.cargo to reading, and with it .cargo/credentials.toml"
fixed_in = "ad43509"
regression = ".cargo/credentials"
code = """
/// What every command may read beyond the world: the toolchains' homes.
fn toolchain_grants(home: &Path) -> Vec<Grant> {
    [".cargo", ".cache", ".rustup", ".npm"]
        .iter()
        .map(|d| Grant::read(home.join(d)))
        .collect()
}
"""

[[case]]
id = "session-toctou-write"
source = "session"
label = "bug"
speciality = "dark-elf-harness"
class = "toctou"
file = "crates/mnemorph-tools/src/files.rs"
symbol = "write_file"
severity = "high"
claim = "write_file checks the canonical path inside the world, then writes through the joined string a command can swap for a symlink"
fixed_in = "69da3cc"
regression = "symlink swaps"
code = """
pub fn write_file(world: &Path, rel: &str, bytes: &[u8]) -> io::Result<()> {
    let path = world.join(rel);
    let real = path.parent().unwrap().canonicalize()?;
    if !real.starts_with(world) {
        return Err(io::Error::other("outside the world"));
    }
    // A command may run between the check above and the write below.
    std::fs::write(&path, bytes)
}
"""

