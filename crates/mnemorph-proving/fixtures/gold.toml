fn ask_card(card: &str, input: &mut impl BufRead, out: &mut impl Write) -> bool {
    let _ = writeln!(out, "{card}\\nApprove? [y/N]");
    let mut line = String::new();
    input.read_line(&mut line).is_ok() && line.trim().eq_ignore_ascii_case("y")
}
"""

