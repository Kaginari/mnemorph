fn open_pr(world: &Path, title: &str, body: &Path, gate: &dyn Gate) -> Result<(), String> {
    let shown = std::fs::read_to_string(body).map_err(|e| e.to_string())?;
    gate.approve(&format!("Open a pull request: {title}\\n\\n{shown}"))?;
    run(world, &["gh", "pr", "create", "--title", title, "--body-file", &body.display().to_string()])
}
"""

