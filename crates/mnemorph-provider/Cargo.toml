[package]
name = "mnemorph-provider"
description = "Model providers: Anthropic and OpenAI-compatible streaming clients, retries, cache breakpoints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mnemorph-ledger = { path = "../mnemorph-ledger" }
tokio = { version = "1", features = ["time", "rt", "macros"] }
toml = "1"

[dev-dependencies]
tokio = { version = "1", features = ["time", "rt", "macros", "test-util"] }

[lints]
workspace = true
