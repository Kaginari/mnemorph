[package]
name = "mnemorph-tools"
description = "The tools: read, index, write, edit, glob, grep, bash, git; the shell classifier; secret injection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
brush-parser = "0.4"
globset = "0.4"
ignore = "0.4"
mnemorph-races = { path = "../mnemorph-races" }
mnemorph-sandbox = { path = "../mnemorph-sandbox" }
mnemorph-wire = { path = "../mnemorph-wire" }
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
