[package]
name = "mnemorph-tools"
description = "The tools: read, write, edit, glob, grep, bash, git; the shell classifier; secret injection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
brush-parser = "0.4"
globset = "0.4"
ignore = "0.4"
mnemorph-races = { path = "../mnemorph-races" }
mnemorph-sandbox = { path = "../mnemorph-sandbox" }
regex = "1"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
