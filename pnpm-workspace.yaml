packages:
  - packages/*
  - site
  - tools/canvas

# Dependencies allowed to run install scripts. esbuild (vite) fetches its platform binary.
allowBuilds:
  esbuild: true

# markdown-it-mathjax3 (the book's formulas) pins an xmldom release npm marks as having critical issues.
overrides:
  "@xmldom/xmldom": ^0.9.12
