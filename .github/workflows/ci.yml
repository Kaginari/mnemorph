name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest,cargo-deny,just,cargo-llvm-cov
      - name: actionlint (pinned, from its own download script)
        run: |
          mkdir -p "$HOME/.local/bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: just check

  board:
    # The board end to end: Chromium at the version @playwright/test pins, its binary cached by
    # that version. Linux only: the page is the same everywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The chat end to end runs on the real server and bridge: the example embeds the built board.
      - name: The board, then the server it is embedded in
        run: |
          pnpm --filter @mnemorph/board build
          cargo build -p mnemorph-server --example board_e2e
      - name: The pinned Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @mnemorph/board exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @mnemorph/board exec playwright install --with-deps chromium
      - name: Chromium's system libraries (the browser is cached)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @mnemorph/board exec playwright install-deps chromium
      - name: Screenshots, contrast, labels, axe, router, drawers, palette, hostile text, chats, approvals, the M12 exit
        run: pnpm --filter @mnemorph/board e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: board-e2e
          path: |
            packages/board/test-results/
            packages/board/playwright-report/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the pages' "last updated" reads each file's history
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every diagram parses (as GitHub's Mermaid would read it)
        run: node tools/check-diagrams.mjs
      - name: Build the book (fails on a dead link)
        run: pnpm --filter @mnemorph/site build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: book
          path: site/.vitepress/dist
