[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# A clean test build is 23 GB with full debug info and 9.7 GB with line tables, which still name
# the file and line of a panic. `ld` died of a bus error at full size on CI, most likely a full disk.
[profile.dev]
debug = "line-tables-only"
