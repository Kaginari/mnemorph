[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The list is the allowed set, not an inventory: an unused entry is fine.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # A permissive licence for data: Mozilla's root certificates (webpki-root-certs), which the
    # TLS platform verifier ships as a fallback trust store.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
